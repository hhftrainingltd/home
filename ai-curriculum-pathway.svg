<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AI curriculum pathway for education professionals</title>
  <desc id="desc">A pathway from shared AI foundations to teacher, assessor and leadership pathways, ending with practical portfolio evidence and improved professional practice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a38"/>
      <stop offset="1" stop-color="#073c49"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020817" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#e6a817"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <text x="60" y="68" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">One curriculum, clear professional pathways</text>
  <text x="60" y="104" fill="#b8ccdf" font-family="Segoe UI,Arial,sans-serif" font-size="18">Shared knowledge first, role-specific application next, practical evidence throughout.</text>

  <path d="M270 260H382" stroke="#e6a817" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M812 260H925" stroke="#e6a817" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="55" y="160" width="215" height="200" rx="26" fill="#fff"/>
    <circle cx="162" cy="215" r="35" fill="url(#blue)"/>
    <path d="M146 216h32M162 200v32" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="162" y="285" text-anchor="middle" fill="#0b2447" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">Shared Foundation</text>
    <text x="162" y="320" text-anchor="middle" fill="#526078" font-family="Segoe UI,Arial,sans-serif" font-size="16">Modules 1–4</text>
    <text x="162" y="345" text-anchor="middle" fill="#526078" font-family="Segoe UI,Arial,sans-serif" font-size="14">AI • Ethics • Prompts • Tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="132" width="414" height="256" rx="28" fill="#eef6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="418" y="164" width="108" height="164" rx="20" fill="#fff"/>
    <circle cx="472" cy="210" r="28" fill="#2563eb"/>
    <path d="M456 216h32M462 205h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="472" y="270" text-anchor="middle" fill="#0b2447" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">Teachers</text>
    <text x="472" y="299" text-anchor="middle" fill="#526078" font-family="Segoe UI,Arial,sans-serif" font-size="13">Learning design</text>

    <rect x="543" y="164" width="108" height="164" rx="20" fill="#fff"/>
    <circle cx="597" cy="210" r="28" fill="#0f766e"/>
    <path d="m582 210 10 10 20-24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="597" y="270" text-anchor="middle" fill="#0b2447" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">Assessors</text>
    <text x="597" y="299" text-anchor="middle" fill="#526078" font-family="Segoe UI,Arial,sans-serif" font-size="13">Evidence &amp; feedback</text>

    <rect x="668" y="164" width="108" height="164" rx="20" fill="#fff"/>
    <circle cx="722" cy="210" r="28" fill="#d99a15"/>
    <path d="M707 220v-20h30v20M714 200v-8h16v8" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <text x="722" y="270" text-anchor="middle" fill="#0b2447" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">Leaders</text>
    <text x="722" y="299" text-anchor="middle" fill="#526078" font-family="Segoe UI,Arial,sans-serif" font-size="13">Governance &amp; impact</text>
    <text x="597" y="365" text-anchor="middle" fill="#0b2447" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Role-specific professional pathways</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="160" width="215" height="200" rx="26" fill="#fff"/>
    <circle cx="1037" cy="215" r="35" fill="#d99a15"/>
    <path d="M1019 225h36M1025 213h24M1031 201h12" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="1037" y="285" text-anchor="middle" fill="#0b2447" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">Portfolio Evidence</text>
    <text x="1037" y="320" text-anchor="middle" fill="#526078" font-family="Segoe UI,Arial,sans-serif" font-size="16">Plan • Check • Apply</text>
    <text x="1037" y="345" text-anchor="middle" fill="#526078" font-family="Segoe UI,Arial,sans-serif" font-size="14">Improve learner outcomes</text>
  </g>

  <text x="600" y="462" text-anchor="middle" fill="#f1c453" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">AI supports the work. Education professionals retain control and accountability.</text>
</svg>
