<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Assessment design guide for stronger evidence learning cycle</title>
  <desc id="desc">A premium visual showing how learning moves from discovery to daily implementation and improvement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
